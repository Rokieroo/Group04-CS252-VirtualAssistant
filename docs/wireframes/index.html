<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframes · Group04 Study Companion</title>
<!--
  Low-fidelity wireframes for core loop S3–S7 (issue #55, spec docs/APP_SPECIFICATION.md sections 4.1, 5, 11.4).
  Open this file in a browser. Sections mirror the Figma pages: Wireframes, States, Components, Flows.
  ?frame=<id> renders one frame at 1:1 and ?section=<id> renders one section; capture.mjs uses both for screenshots.
-->
<style>
  :root { --ink:#222; --muted:#666; --line:#c4c4c4; --fill:#e8e8e8; --soft:#f5f5f5; --page:#dcdcdc; --bad:#b3261e; --ok:#137333; --warn:#b06000; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--page); color:var(--ink); font:16px/1.45 Inter, system-ui, "Segoe UI", sans-serif; }
  h1,h2,h3,p { margin:0; }
  .board > h1 { font-size:28px; margin-bottom:4px; }
  .board > p { color:#444; margin-bottom:24px; max-width:900px; }
  section.sec { margin-bottom:40px; }
  section.sec > h2 { font-size:22px; margin-bottom:4px; }
  section.sec > p { color:#444; margin-bottom:16px; }
  .row { display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start; margin-bottom:24px; }
  .card { display:flex; flex-direction:column; gap:6px; }
  .card > .label { font-size:13px; font-weight:600; color:#333; }
  .thumb { zoom:.4; border:2px solid #999; background:#fff; }
  a.thumb-link { color:inherit; text-decoration:none; }
  .arrow { align-self:center; font-size:28px; color:#555; }
  body.solo { padding:0; background:#fff; }
  body.solo .thumb { zoom:1; border:0; }

  /* App shell */
  .frame { position:relative; overflow:hidden; background:#fff; }
  .app { display:flex; height:100%; }
  .app.d .side { width:232px; flex:none; border-right:1px solid var(--line); padding:24px 16px; display:flex; flex-direction:column; gap:4px; background:var(--soft); }
  .logo { display:block; font-size:18px; margin-bottom:24px; padding-left:8px; }
  .nav-i { display:flex; align-items:center; gap:12px; min-height:44px; padding:0 12px; border-radius:8px; color:var(--muted); font-size:15px; }
  .nav-i.on { background:var(--fill); color:var(--ink); font-weight:600; }
  .app main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:16px; height:64px; padding:0 32px; border-bottom:1px solid var(--line); flex:none; }
  .top h1 { font-size:24px; }
  .avatar { width:36px; height:36px; border-radius:50%; background:var(--fill); border:1px solid var(--line); flex:none; }
  .content { flex:1; overflow:hidden; padding:24px 32px; display:flex; flex-direction:column; gap:16px; }
  .app.m { flex-direction:column; }
  .app.m .top { height:56px; padding:0 16px; }
  .app.m .top h1 { font-size:20px; }
  .app.m .content { padding:16px; }
  .bottom { display:flex; border-top:1px solid var(--line); height:72px; flex:none; background:var(--soft); }
  .bottom .nav-i { flex:1; flex-direction:column; justify-content:center; gap:2px; font-size:11px; padding:0; border-radius:0; }
  .cols { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:24px; flex:1; min-height:0; }
  .app.m .cols { display:flex; flex-direction:column; gap:16px; }
  .app.m .d-only, .app.d .m-only { display:none !important; }
  .stack { display:flex; flex-direction:column; gap:12px; min-height:0; }
  .panel { border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:12px; background:#fff; }
  .panel.soft { background:var(--soft); }
  .panel h3, .h3 { font-size:20px; }
  .between { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .inline { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .grow { flex:1; }
  .muted { color:var(--muted); }
  .sm { font-size:14px; }
  .xs { font-size:12px; }
  .center { text-align:center; }
  .spacer { flex:1; }
  .content > *, .stack > *, .cols > * { flex-shrink:0; }
  .content > .spacer, .stack > .spacer { flex-shrink:1; }
  .wrap { flex-wrap:wrap; }
  .app.m .h3 { font-size:18px; }
  .app.m .m-hide { display:none; }

  /* Pieces */
  .ico { display:inline-block; width:20px; height:20px; border-radius:5px; background:var(--line); flex:none; }
  .ico.lg { width:48px; height:48px; border-radius:12px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; min-width:44px; padding:0 16px; border:1px solid #888; border-radius:10px; background:#fff; font:inherit; font-size:15px; font-weight:600; color:var(--ink); white-space:nowrap; cursor:pointer; }
  .btn.primary { background:#333; border-color:#333; color:#fff; }
  .btn.ghost { border-color:transparent; background:transparent; }
  .btn.off { opacity:.45; }
  .btn.block { width:100%; }
  .btn.sm { min-height:32px; padding:0 10px; font-size:13px; border-radius:8px; }
  .chip { display:inline-flex; align-items:center; gap:4px; min-height:28px; padding:0 10px; border:1px solid #888; border-radius:999px; font-size:13px; font-weight:600; color:var(--ink); text-decoration:underline; background:var(--soft); white-space:nowrap; }
  .chip.none { text-decoration:none; border-style:dashed; color:var(--muted); }
  .tag { display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:999px; background:var(--fill); font-size:13px; font-weight:500; }
  .tag.on { background:#333; color:#fff; }
  .tag.ok { background:#e6f4ea; color:var(--ok); border:1px solid #ceead6; font-weight:600; }
  .tag.warn { background:#fef7e0; color:var(--warn); border:1px solid #feefc3; font-weight:600; }
  .bar { height:8px; border-radius:99px; background:var(--fill); overflow:hidden; }
  .bar > i { display:block; height:100%; background:#555; }
  .skel { height:14px; border-radius:6px; background:var(--fill); }
  .skel.w60 { width:60%; } .skel.w80 { width:80%; } .skel.w40 { width:40%; }
  .skel.block { height:72px; border-radius:12px; }
  .input { display:flex; align-items:center; min-height:44px; padding:0 14px; border:1px solid #888; border-radius:10px; color:var(--muted); background:#fff; font-size:14px; }
  .input.area { align-items:flex-start; min-height:96px; padding-top:10px; }
  .field { display:flex; flex-direction:column; gap:6px; font-size:14px; font-weight:600; }
  .check { width:20px; height:20px; border:1.5px solid #777; border-radius:4px; flex:none; display:inline-flex; align-items:center; justify-content:center; font-size:14px; }
  .check.on { background:#333; color:#fff; border-color:#333; }
  .lock { width:16px; height:16px; flex:none; }
  .note { border:1px dashed #8a8a8a; border-radius:8px; padding:8px 12px; font-size:13px; color:#444; background:#fafafa; }
  .alert { display:flex; gap:12px; align-items:flex-start; border:2px solid #333; border-radius:12px; padding:12px 16px; }
  .alert.bad { border-color:var(--bad); background:#fdf3f2; }
  .alert.warn { border-color:var(--warn); background:#fef9ef; }
  .alert .ico { background:#333; }
  .alert.bad .ico { background:var(--bad); }
  .alert.warn .ico { background:var(--warn); }
  .toast { position:absolute; left:50%; bottom:96px; transform:translateX(-50%); display:flex; align-items:center; gap:16px; padding:8px 8px 8px 16px; border-radius:12px; background:#333; color:#fff; font-size:14px; white-space:nowrap; }
  .toast .btn { min-height:36px; background:transparent; color:#fff; border-color:#fff; }
  .app.m .toast { bottom:144px; }
  .app.d .toast { bottom:84px; }
  .drop { border:2px dashed #888; border-radius:16px; padding:24px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; background:var(--soft); }
  .drop.big { padding:56px 24px; }
  .file { display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
  .file.err { border:2px solid var(--bad); }
  .file > .ico { width:28px; height:36px; border-radius:4px; }
  .file .meta { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .err-text { color:var(--bad); font-weight:600; font-size:14px; }
  .one-line { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); padding-bottom:2px; flex-wrap:wrap; }
  .tab { padding:8px 16px; font-weight:600; font-size:14px; color:var(--muted); border-radius:8px 8px 0 0; cursor:pointer; }
  .tab.on { color:var(--ink); border-bottom:2px solid #333; background:var(--soft); }
  .source-card { border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:10px; background:#fff; }
  .domain-link { font-family:monospace; font-size:13px; color:#1a0dab; text-decoration:underline; font-weight:600; }
  .score-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:8px; background:#e8f0fe; color:#174ea6; font-weight:700; font-size:14px; border:1px solid #d2e3fc; }
  .rubric-table { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
  .rubric-table th, .rubric-table td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; }
  .rubric-table th { background:var(--soft); font-weight:600; }
  .quote-box { border-left:3px solid #666; padding-left:12px; font-style:italic; font-size:13px; color:#444; background:var(--soft); padding:8px 12px; border-radius:0 8px 8px 0; }
  .timeline-week { border:1px solid var(--line); border-radius:12px; padding:14px; background:#fff; display:flex; flex-direction:column; gap:8px; }
  .timeline-week.milestone { border:2px solid #333; background:#fafafa; }
  .timeline-week.overload { border:2px solid var(--warn); background:#fffdf8; }
  .node-chip { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fff; }
  .node-chip.done { border-color:#ceead6; background:#e6f4ea; }
  .node-chip.in-prog { border-color:#feefc3; background:#fef7e0; }
  .node-chip.avail { border-color:#d2e3fc; background:#e8f0fe; }
  .node-chip.locked { opacity:.6; background:var(--soft); }
  .cal-week { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; border:1px solid var(--line); border-radius:12px; padding:12px; background:#fff; }
  .app.m .cal-week { grid-template-columns:1fr; }
  .cal-day { display:flex; flex-direction:column; gap:6px; min-height:90px; border-radius:8px; padding:8px; background:var(--soft); font-size:12px; }
  .cal-event { padding:6px 8px; border-radius:6px; background:#333; color:#fff; font-size:12px; font-weight:600; display:flex; flex-direction:column; gap:2px; }
  .cal-event.moved { background:var(--ok); }
  .cal-event.missed { background:var(--bad); }
  .stat { font-size:36px; font-weight:700; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const SIZE = { d: [1440, 900], m: [390, 844] };
const NAV = [["home", "Trang chủ"], ["courses", "Môn học"], ["roadmap", "Roadmap"], ["schedule", "Lịch học"], ["review", "Ôn tập"], ["companion", "Companion"]];
const LOCK = '<svg class="lock" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="8" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';

const btn = (label, kind = "") => `<span class="btn ${kind}">${label}</span>`;
const chip = (file, page) => `<span class="chip">${file} · tr. ${page}</span>`;
const bar = (pct) => `<div class="bar"><i style="width:${pct}%"></i></div>`;
const skel = (...w) => w.map((c) => `<div class="skel ${c}"></div>`).join("");
const progress = (pct, text) => `${bar(pct)}<span class="sm">${text}</span>`;
const alert = (title, body, kind = "") => `<div class="alert ${kind}"><i class="ico"></i><div class="stack" style="gap:6px"><b>${title}</b>${body}</div></div>`;
const empty = (title, text, actions) => `<div class="drop big"><i class="ico lg"></i><b>${title}</b><span class="muted sm">${text}</span><div class="inline">${actions}</div></div>`;

function shell(size, active, title, body) {
  const nav = NAV.map(([k, l]) => `<span class="nav-i ${k === active ? "on" : ""}"><i class="ico"></i>${l}</span>`).join("");
  const top = `<header class="top"><h1>${title}</h1><span class="avatar"></span></header>`;
  return size === "d"
    ? `<div class="app d"><aside class="side"><b class="logo">Study Companion</b>${nav}</aside><main>${top}<div class="content">${body}</div></main></div>`
    : `<div class="app m">${top}<div class="content">${body}</div><nav class="bottom">${nav}</nav></div>`;
}

// ==========================================
// S3: Tải syllabus (Upload Syllabus)
// ==========================================
function fileRow(name, meta, status, extra = "") {
  const right = { done: '<span class="tag ok">✓ Trích xong</span>', prog: '<span class="tag">Đang xử lý</span>', err: btn("Xóa", "ghost sm") }[status];
  return `<div class="file ${status === "err" ? "err" : ""}"><i class="ico"></i><div class="meta"><b class="one-line">${name}</b><span class="muted sm">${meta}</span>${extra}</div>${right}</div>`;
}
const fileError = (text, action = "") => `<span class="err-text">${text}</span>${action}`;

function s3(state) {
  const isErr = state === "error";
  const drop = `<div class="drop ${state === "empty" ? "big" : ""}"><i class="ico lg"></i><b>Kéo thả file Syllabus (PDF hoặc DOCX) vào đây</b>
    <span class="muted sm">hoặc bấm để chọn file từ máy tính</span>
    <div class="inline">${btn("Chọn file PDF/DOCX")}${btn("Dán văn bản syllabus", "ghost")}</div>
    <span class="muted xs">Giới hạn tối đa 20 MB · File có cấu trúc tuần, chuẩn đầu ra & mốc kiểm tra</span></div>`;

  const pasteBox = `<div class="panel soft d-only"><label class="field">Hoặc dán nội dung văn bản syllabus:
    <div class="input area" style="font-family:monospace;font-size:13px">HỌC VIỆN CÔNG NGHỆ BƯU CHÍNH VIỄN THÔNG / ĐẠI HỌC KHOA HỌC TỰ NHIÊN\nĐỀ CƯƠNG CHI TIẾT HỌC PHẦN: CS252 - TƯ DUY TÍNH TOÁN\n1. Chuẩn đầu ra (CLO 1.1, CLO 1.2...)\n2. Phân bổ tuần học & nội dung chi tiết...</div></label>
    <div class="between"><span class="muted xs">Hệ thống phân tích tự động chuẩn đầu ra & phân bổ tuần</span>${btn("Phân tích văn bản", "sm")}</div></div>`;

  const files = {
    empty: `<p class="center muted" style="margin-top:24px">Chưa có syllabus nào được tải lên. Tải đề cương môn học để hệ thống lập roadmap học tập.</p>`,
    default: fileRow("CS252_Syllabus_2026.pdf", "8 trang · 2,4 MB · Đã trích 14 CLO & 15 tuần", "done")
      + fileRow("GiaoTrinh_ThamKhao_Ch1-3.pdf", "45 trang · 5,1 MB", "done")
      + `<div class="panel soft"><b>Mục tiêu học tập cá nhân (không bắt buộc):</b>
          <div class="input">Đạt điểm A (≥ 8.5), nắm chắc tư duy giải thuật & vượt qua đồ án cuối kỳ.</div></div>`,
    loading: `<div class="panel"><b>Đang phân tích cấu trúc đề cương syllabus…</b>${progress(65, "Trích xuất chuẩn đầu ra (CLO), các mốc thi giữa kỳ & phân bổ 15 tuần (khoảng 30 giây)")}</div>`
      + fileRow("CS252_Syllabus_2026.pdf", "8 trang · 2,4 MB", "prog")
      + `<p class="muted sm center">Bạn có thể rời trang, tiến trình phân tích vẫn chạy ngầm.</p>`,
    error: fileRow("Lecture_Full_Recording.pdf", "48,5 MB", "err", fileError("File vượt quá 20 MB. Vui lòng nén hoặc chỉ tải tài liệu đề cương."))
      + fileRow("Scan_Syllabus_ImageOnly.pdf", "14 trang · 9,2 MB", "err", fileError("File PDF chỉ chứa hình ảnh scan không có text. Hãy dùng tính năng dán văn bản.", `<div>${btn("Dán văn bản thay thế", "sm")}</div>`))
      + fileRow("Notes_Random_Paper.docx", "850 KB", "err", fileError("Tài liệu không giống đề cương syllabus (thiếu chuẩn đầu ra, tuần học hoặc mốc đánh giá)."))
      + fileRow("Damaged_File.pdf", "1,8 MB", "err", fileError("File bị lỗi định dạng hoặc hỏng, không thể đọc.")),
  }[state];

  const sideInfo = `<div class="panel soft d-only"><h3>Quy trình phân tích syllabus</h3>
    <div class="inline"><span class="tag on">1</span>Trích chuẩn đầu ra (CLO) & mục tiêu</div>
    <div class="inline"><span class="tag">2</span>Phân bổ 10–15 tuần với chủ đề tương ứng</div>
    <div class="inline"><span class="tag">3</span>Trích xuất mốc kiểm tra (Giữa kỳ, Cuối kỳ) & trọng số</div>
    <div class="inline"><span class="tag">4</span>Lập Knowledge Graph & Weekly Roadmap</div>
    <div class="note">Mọi thông tin trích xuất đều có citation trỏ về số trang syllabus gốc để bạn kiểm tra.</div></div>`;

  const bottomAction = state === "empty" ? "" : `<div class="between"><span class="muted sm">${isErr ? "Vui lòng xóa file lỗi để tiếp tục" : "Đã trích xuất xong 15 tuần học"}</span>
    ${btn("Xem & Duyệt Syllabus (S4) →", isErr ? "primary off" : "primary")}</div>`;

  return { title: "Tải syllabus · CS252", nav: "courses", body: `<div class="cols"><div class="stack">${drop}${files}${state === "empty" ? pasteBox : ""}<div class="spacer"></div>${bottomAction}</div>${sideInfo}</div>` };
}

// ==========================================
// S4: Duyệt syllabus (Review Syllabus)
// ==========================================
function s4(state) {
  const isErr = state === "error";
  const tabs = `<div class="tabs">
    <span class="tab on">Tuần & chủ đề (15)</span>
    <span class="tab">Chuẩn đầu ra CLO (6)</span>
    <span class="tab">Đánh giá & Mốc thi (3)</span>
    <span class="tab">Giáo trình & Nguồn (2)</span>
  </div>`;

  const warnBanner = isErr ? alert("Cảnh báo phát hiện trong syllabus:",
    `<div class="stack sm" style="gap:4px">
      <span>• <b>Tổng trọng số đánh giá = 85%</b> (chưa đủ 100%: GK 30%, CK 55%).</span>
      <span>• <b>Ngày thi cuối kỳ 20/07/2026</b> nằm ngoài thời gian học kỳ (kết thúc 30/06/2026).</span>
      <span>• <b>Tuần 6 chưa có chủ đề</b> hoặc bị bỏ trống.</span>
    </div><div class="inline" style="margin-top:6px">${btn("Tự động sửa lỗi", "primary sm")}${btn("Bỏ qua cảnh báo", "ghost sm")}</div>`, "warn") : "";

  const weeksTable = `<div class="panel" style="padding:0;overflow:hidden">
    <table style="width:100%;border-collapse:collapse;font-size:14px">
      <thead style="background:var(--soft);border-bottom:1px solid var(--line)">
        <tr><th style="padding:10px 14px;text-align:left;width:70px">Tuần</th>
            <th style="padding:10px 14px;text-align:left">Chủ đề bài học (Nhấp để sửa)</th>
            <th style="padding:10px 14px;text-align:left;width:120px">CLO</th>
            <th style="padding:10px 14px;text-align:left;width:140px">Trích dẫn trang</th>
            <th style="padding:10px 14px;text-align:center;width:90px">Thao tác</th></tr>
      </thead>
      <tbody>
        <tr style="border-bottom:1px solid var(--line)">
          <td style="padding:10px 14px"><b>Tuần 1</b></td>
          <td style="padding:10px 14px">Giới thiệu Tư duy tính toán & Biểu diễn bài toán</td>
          <td style="padding:10px 14px"><span class="tag">CLO 1.1</span></td>
          <td style="padding:10px 14px">${chip("Syllabus.pdf", 2)}</td>
          <td style="padding:10px 14px;text-align:center">${btn("Sửa", "ghost sm")}</td>
        </tr>
        <tr style="border-bottom:1px solid var(--line)">
          <td style="padding:10px 14px"><b>Tuần 2</b></td>
          <td style="padding:10px 14px">Decomposition (Phân rã) & Abstraction (Trừu tượng hóa)</td>
          <td style="padding:10px 14px"><span class="tag">CLO 1.2</span></td>
          <td style="padding:10px 14px">${chip("Syllabus.pdf", 3)}</td>
          <td style="padding:10px 14px;text-align:center">${btn("Sửa", "ghost sm")}</td>
        </tr>
        <tr style="border-bottom:1px solid var(--line);background:#fafafa">
          <td style="padding:10px 14px"><b>Tuần 8</b></td>
          <td style="padding:10px 14px"><b>[Mốc kiểm tra] Thi giữa kỳ trắc nghiệm & tự luận (30%)</b></td>
          <td style="padding:10px 14px"><span class="tag on">CLO 1-3</span></td>

  s10: () => ({ title: "Companion đồng hành", nav: "companion", body: `<div class="panel soft"><div class="between"><b>AI Đồng hành (Buddy Mode)</b><span class="tag ok">Đang hoạt động</span></div><p class="sm" style="margin-top:8px">Chào Thịnh! Chúc mừng bạn đã hoàn thành tuần 1 môn CS252. Tuần này chúng mình cùng chinh phục kỹ thuật Phân rã bài toán nhé!</p></div>` }),
};

// Registered 5 main core loop screens for Issue #55:
const SCREENS = {
  s3: ["S3 Tải syllabus", s3],
  s4: ["S4 Duyệt syllabus", s4],
  s5: ["S5 Roadmap", s5],
  s6: ["S6 Trang chặng", s6],
  s7: ["S7 Lịch học", s7],
};

const STATES = ["empty", "loading", "error"];
const STATE_NOTE = {
  s3: { empty: "chưa có file", loading: "đang trích text & phân tích", error: "file hỏng, >20MB, chỉ có ảnh, không giống syllabus" },
  s4: { empty: "chưa có dữ liệu syllabus", loading: "đang trích xuất cấu trúc", error: "trọng số ≠ 100%, ngày ngoài kỳ, tuần trống" },
  s5: { empty: "chưa có roadmap", loading: "đang dựng roadmap & graph", error: "vòng lặp phụ thuộc (cycle), tuần 7 quá tải" },
  s6: { empty: "chưa tìm được nguồn đủ tốt", loading: "đang tìm kiếm & thẩm định", error: "mất liên kết / lỗi mạng" },
  s7: { empty: "chưa xếp lịch học", loading: "đang tối ưu hóa lịch", error: "trễ hạn kế hoạch, xung đột giờ học" },
};

// Every frame: [id, screen, state, size, label]
const FRAMES = [];
const add = (screen, state, size, label) => FRAMES.push([`${screen}-${state}-${size}`, screen, state, size, label]);

for (const [k, [name]] of Object.entries(SCREENS)) {
  add(k, "default", "d", `${name} · desktop 1440×900`);
  add(k, "default", "m", `${name} · mobile 390×844`);
  if (k === "s6") {
    add(k, "submitted", "d", `${name} · bảng 7 tiêu chí (rubric) · desktop`);
    add(k, "submitted", "m", `${name} · bảng 7 tiêu chí (rubric) · mobile`);
  }
  for (const s of STATES) {
    add(k, s, "m", `${name} · ${s}: ${STATE_NOTE[k][s]}`);
  }
}
for (const k of Object.keys(FLOW_ONLY)) {
  add(k, "default", "d", k.toUpperCase());
}

const byId = Object.fromEntries(FRAMES.map((f) => [f[0], f]));

function frameHtml(id) {
  const [, screen, state, size] = byId[id];
  const view = (SCREENS[screen] ? SCREENS[screen][1] : FLOW_ONLY[screen])(state);
  const [w, h] = SIZE[size];
  return `<div class="frame" style="width:${w}px;height:${h}px">${view.raw || shell(size, view.nav, view.title, view.body)}</div>`;
}

const card = (id, label) => `<div class="card"><span class="label">${label}</span><div class="thumb">${frameHtml(id)}</div></div>`;

// Core Loop Journey (Spec section 4.1)
const FLOW = [
  ["s1-default-d", "1. Đăng ký & chọn cấp học (S1)"],
  ["s2-default-d", "2. Tạo môn học (S2)"],
  ["s3-default-d", "3. Kéo thả Syllabus PDF/DOCX (S3)"],
  ["s4-default-d", "4. Duyệt chuẩn đầu ra & tuần học (S4)"],
  ["s5-default-d", "5. Xem Roadmap & mốc thi (S5)"],
  ["s6-default-d", "6. Xem Trang chặng & nguồn học 7 tiêu chí (S6)"],
  ["s7-default-d", "7. Xếp lịch học & duyệt Replan (S7)"],
  ["s10-default-d", "8. Đồng hành cùng AI Companion (S10)"],
];

const COMPONENTS = `<div class="row" style="background:#fff;padding:24px;border-radius:12px">
  <div class="stack"><b>Nút bấm chuẩn WCAG (≥ 44×44 px)</b>
    <div class="inline">${btn("Nút chính", "primary")}${btn("Nút phụ")}${btn("Vô hiệu", "primary off")}${btn("Trong suốt", "ghost")}</div>
  </div>
  <div class="stack"><b>Thẻ trích dẫn trang</b>
    <div class="inline">${chip("Syllabus_CS252.pdf", 3)}<span class="chip none">không có nguồn</span></div>
  </div>
  <div class="stack" style="width:360px"><b>Thẻ điểm chất lượng (7 tiêu chí)</b>
    <div class="inline"><span class="score-badge">★ Điểm: 0.88 / 1.0</span><span class="tag ok">✓ Đã xác minh</span></div>
  </div>
  <div class="stack" style="width:340px"><b>Đoạn trích minh chứng</b>
    <div class="quote-box">“Decomposition allows us to break complex problems into smaller subproblems...”</div>
  </div>
  <div class="stack" style="width:300px"><b>Phản hồi một chạm</b>
    <div class="inline">${btn("👍 Hữu ích (92%)", "sm ghost")}${btn("👎 Không hữu ích", "sm ghost")}</div>
  </div>
  <div class="stack" style="width:420px"><b>Thông báo lỗi & Replan</b>
    ${alert("Vòng lặp phụ thuộc (Cycle): Chặng 4 → Chặng 2 bị từ chối.", "", "bad")}
    ${alert("Đề xuất xếp lại lịch (Replan): Dời buổi học sang Thứ Bảy.", "", "warn")}
  </div>
</div>`;

const SECTIONS = {
  wireframes: ["Wireframes Core Loop (S3–S7)", "5 màn hình chính ở Desktop 1440×900 và Mobile 390×844 theo Spec 3.0 mục 5.",
    Object.keys(SCREENS).map((k) => `<div class="row">${FRAMES.filter((f) => f[1] === k && !STATES.includes(f[2])).map((f) => card(f[0], f[4])).join("")}</div>`).join("")],
  states: ["Các trạng thái bắt buộc (States)", "Empty, loading, error cho từng màn hình S3–S7 ở kích thước Mobile.",
    Object.keys(SCREENS).map((k) => `<div class="row">${STATES.map((s) => card(`${k}-${s}-m`, byId[`${k}-${s}-m`][4])).join("")}</div>`).join("")],
  components: ["Components", "Các thành phần UI dùng lại trong toàn bộ Core Loop.", COMPONENTS],
  flows: ["Core Loop Flow (Spec 4.1)", "Luồng trải nghiệm người học từ tải syllabus đến xếp lịch học và đồng hành.",
    `<div class="row">${FLOW.map(([id, label], i) => `<a class="thumb-link" id="flow-${i}" href="#flow-${(i + 1) % FLOW.length}">${card(id, label)}</a>${i < FLOW.length - 1 ? '<span class="arrow">→</span>' : ""}`).join("")}</div>`],
};

const params = new URLSearchParams(location.search);
const root = document.getElementById("root");
const section = (k) => { const [title, desc, html] = SECTIONS[k]; return `<section class="sec" id="${k}"><h2>${title}</h2><p>${desc}</p>${html}</section>`; };

if (params.has("frame")) {
  document.body.classList.add("solo");
  root.innerHTML = `<div class="thumb">${frameHtml(params.get("frame"))}</div>`;
} else if (params.has("section")) {
  root.innerHTML = section(params.get("section"));
} else {
  const toc = Object.keys(SECTIONS).map((k) => `<a href="#${k}">${SECTIONS[k][0]}</a>`).join(" · ");
  root.innerHTML = `<div class="board"><h1>Group04 · Study Companion · Core Loop Wireframes (S3–S7)</h1>
    <p>Wireframes chi tiết cho Issue #55 (Spec 3.0 mục 4.1, 5, 11.4). Bốn phần tương ứng Figma pages: ${toc}.</p>
    ${Object.keys(SECTIONS).map(section).join("")}</div>`;
}

window.FRAMES = FRAMES;
</script>
