services:
  db:
    image: postgres:16-alpine
    container_name: study_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-study_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-study_pass}
      POSTGRES_DB: ${POSTGRES_DB:-study}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-study_user} -d $${POSTGRES_DB:-study}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: study_api
    restart: always
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-study_user}:${POSTGRES_PASSWORD:-study_pass}@db:5432/${POSTGRES_DB:-study}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      SESSION_MINUTES: ${SESSION_MINUTES:-60}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Healthy only after `alembic upgrade head`, which the worker relies on.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Background jobs: link checks now, syllabus parsing and resource search later.
  # Scale out with `docker compose up -d --scale worker=3`; logs: `docker compose logs -f worker`.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: ["python", "-m", "assistant.backend.worker"]
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy

  # One-shot: loads the bundled catalog sample (sources for the CSC10014 roadmap) so a
  # new machine has catalog sources at once. Idempotent; dev only. Staging loads a real
  # snapshot instead: `python -m devcli db seed-catalog --file <snapshot.json>`.
  catalog-seed:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["python", "-m", "devcli", "db", "seed-catalog", "--sample"]
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

