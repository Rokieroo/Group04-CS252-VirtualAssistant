# Internal resource catalog (spec 11.2).
#
# CatalogSearch accepts a top-level list, a single resource mapping, or a
# mapping with one of: resources, items, entries, catalog. Every resource needs
# at least `title` and `url`; `kind`, `lang`, `provider`, `snippet`, and `tags`
# are optional. `tags`/`topics`/`keywords`/`course` are all used for matching.
#
# The manual_yaml catalog connector (#98) also stores every entry as a pending
# catalog resource; it needs `license`, an id of data/policy/catalog_sources.yaml
# (ADR 004). Format: src/app/catalog/connectors/manual_yaml.py.
resources:
  - title: "Problem framing and the solution ladder"
    url: "https://ocw.mit.edu/courses/6-100l-introduction-to-cs-and-programming-in-python-fall-2022/"
    license: CC-BY-NC-SA-4.0
    kind: article
    lang: en
    provider: catalog
    snippet: "Lecture notes and worked examples for breaking a problem into steps and choosing a solution approach."
    tags: [problem framing, solution ladder, computational thinking, CSC10014, lecture notes]

  - title: "Introduction to Computer Science and Programming in Python"
    url: "https://ocw.mit.edu/courses/6-0001-introduction-to-computer-science-and-programming-in-python-fall-2016/"
    license: CC-BY-NC-SA-4.0
    kind: video
    lang: en
