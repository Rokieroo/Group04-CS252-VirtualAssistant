# Subject taxonomy (issue #99): field -> subject -> topic.
#
# The same labels go on roadmap nodes and on catalog resources, so #102 can match
# them and #98 knows which subjects to ingest. Read by app.taxonomy.load_taxonomy();
# tests/test_taxonomy.py keeps it well-formed.
#
# - slug: the parent's slug plus one segment ("computing.databases.sql"). Never
#   rename a slug: stored labels point at it. Retire one in a PR that also
#   migrates its labels.
# - name / name_vi: display names, both required; both also count as keywords.
# - ref: where the entry comes from (ACM CCS 2012 for computing, MSC 2020 for
#   mathematics, GDPT 2018 for K-12) or the syllabus that needed it.
# - keywords: phrases that identify the entry, English and Vietnamese. Matching
#   ignores case and Vietnamese diacritics and accepts a plural "s". Prefer specific
#   phrases: a word that fits many subjects ("process", "index", "stack") mislabels.
# - course_codes: regular expressions, matched in full against a course code.
# - departments (fields and subjects): names of the faculty that teaches them.
# - levels (fields only): learner levels the field serves (k12 | undergrad | grad).
#
# Start: CSC10014 and the syllabi in eval/syllabus/ (#66). Add a subject when a
# syllabus needs one, in the same PR as the syllabus.

