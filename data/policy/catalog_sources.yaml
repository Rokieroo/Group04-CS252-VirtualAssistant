# Sources the verified catalog may use (ADR 004, docs/adr/004-verified-catalog.md).
#
# Connectors (#98) read `method`, `endpoint` and `rate_limit_per_sec`; the
# license check (#101) accepts only the ids under `licenses`. Change this file
# only in a PR reviewed by 2 members, after re-reading the `evidence` page, and
# update `checked_on`. tests/test_catalog_sources.py keeps it consistent with
# the ADR table and the domain policy.
#
# licenses.<id>.verbatim: exercises may be stored word for word (spec 12.2).
# Otherwise the catalog keeps only a link + location (page, problem number).
#
# providers[].use:       source = shown on roadmap nodes; authority = only feeds
#                        the `authority` signal (institutions, #96), never shown.
# providers[].method:    api | sitemap | manual (added by hand, admin-verified).
# providers[].automated: false = no connector or verifier request may touch
#                        these domains (terms forbid it or a bot challenge
#                        blocks it); an admin checks the link by hand.
# providers[].license:   a license id, or `per_item` with the ids the provider
#                        uses in `item_licenses` (read per book/video).

licenses:
  CC0-1.0:
    name: CC0 1.0 Universal (public domain dedication)
    url: https://creativecommons.org/publicdomain/zero/1.0/
    verbatim: true
  CC-BY-3.0:
    name: Creative Commons Attribution 3.0
    url: https://creativecommons.org/licenses/by/3.0/
    verbatim: true
  CC-BY-4.0:
    name: Creative Commons Attribution 4.0
    url: https://creativecommons.org/licenses/by/4.0/
    verbatim: true
  CC-BY-SA-4.0:
    name: Creative Commons Attribution-ShareAlike 4.0
    url: https://creativecommons.org/licenses/by-sa/4.0/
    verbatim: true
  CC-BY-NC-SA-3.0:
    name: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported
    url: https://creativecommons.org/licenses/by-nc-sa/3.0/
    verbatim: false
  CC-BY-NC-SA-4.0:
    name: Creative Commons Attribution-NonCommercial-ShareAlike 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
    verbatim: false
  VN-LEGAL-TEXT:
    name: Văn bản quy phạm pháp luật, không thuộc phạm vi bảo hộ quyền tác giả (Điều 15 Luật SHTT)
    url: null
    verbatim: true
  ALL-RIGHTS-RESERVED:
    name: All rights reserved; link and ≤ 300-character quotation only
    url: null
    verbatim: false

providers:
  - id: mit_ocw
    name: MIT OpenCourseWare
    use: source
    levels: [undergrad, grad]
    domains: [ocw.mit.edu]
    license: CC-BY-NC-SA-4.0
    method: sitemap
    endpoint: https://ocw.mit.edu/sitemap.xml
    automated: true
    rate_limit_per_sec: 1
    attribution: "{title}, MIT OpenCourseWare, {url}. CC BY-NC-SA 4.0."
    evidence: https://ocw.mit.edu/pages/privacy-and-terms-of-use/
    checked_on: 2026-11-05

  - id: openstax
    name: OpenStax
    use: source
    levels: [k12, undergrad]
    domains: [openstax.org]
    license: per_item
    item_licenses: [CC-BY-4.0, CC-BY-NC-SA-4.0]
    method: api
    endpoint: https://openstax.org/apps/cms/api/v2/pages/?type=books.Book&fields=title,license_name,license_version,book_state,book_subjects,book_categories,description
    automated: true
    rate_limit_per_sec: 1
    attribution: "{title}, OpenStax, {url}. {license}."
    evidence: https://help.openstax.org/s/article/Licensing-information-of-OpenStax-textbooks
    checked_on: 2026-11-05

